# Entorno de desarrollo local: Postgres + API (bun --hot) + web (next dev).
# Produccion NO usa este fichero, usa deployments/postgres + deployments/_template.
name: kidcare-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: kidcare-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kidcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kidcare_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kidcare_dev}
    ports:
      # 5433 en el host para no chocar con un Postgres instalado localmente.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - kidcare_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kidcare} -d ${POSTGRES_DB:-kidcare_dev}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: kidcare-dev-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kidcare}:${POSTGRES_PASSWORD:-kidcare_dev}@postgres:5432/${POSTGRES_DB:-kidcare_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion-1234567890}
      TENANT_NAME: ${TENANT_NAME:-Guarderia Demo}
      PORT: '3001'
      # La cookie de sesion httpOnly exige credentials:true, y los
      # navegadores rechazan '*' junto con eso: hay que listar el origen
      # real de la web.
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      # Claves de desarrollo listas para usar; genera las tuyas en produccion
      # con `bunx web-push generate-vapid-keys`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BH-VmTe1fJ7WTi1etP_YSbvYtmRYE19miSs0fjZ4n9N96hYWYX58nJKclvKnVKjlxMgGaTUawVUf90gFZVF3maE}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-s2lWTT8YCGqGRKAIoYLM6K-DNJeIgA03ptyDpQQK5Ls}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@kidcare.test}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Se montan SOLO carpetas de codigo, nunca un workspace entero: bun 1.4
      # instala las dependencias dentro de cada paquete
      # (packages/db/node_modules), y montar ./packages las taparia con las del
      # host —que en Windows son symlinks que Linux no sabe seguir—.
      - ./apps/api/src:/app/apps/api/src
      - ./packages/db/src:/app/packages/db/src
      - ./packages/db/drizzle:/app/packages/db/drizzle
      - ./packages/types/src:/app/packages/types/src
    command:
      - sh
      - -c
      - 'bun packages/db/src/migrate.ts && bun --hot apps/api/src/index.ts'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: kidcare-dev-web
    restart: unless-stopped
    environment:
      # API_URL/TENANT_NAME (sin prefijo) se leen en runtime desde
      # apps/web/app/layout.tsx: es el mismo camino que usa produccion, para
      # detectar aqui mismo cualquier regresion. Los NEXT_PUBLIC_* quedan de
      # respaldo por si algo corre fuera de Docker.
      API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      TENANT_NAME: ${TENANT_NAME:-Guarderia Demo}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_TENANT_NAME: ${TENANT_NAME:-Guarderia Demo}
      WATCHPACK_POLLING: 'true'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      - api
    volumes:
      - ./apps/web/app:/app/apps/web/app
      - ./apps/web/components:/app/apps/web/components
      - ./apps/web/lib:/app/apps/web/lib
      - ./apps/web/public:/app/apps/web/public
      # tailwind.config.ts y postcss.config.mjs viven en la raiz de apps/web,
      # fuera de los directorios de arriba: sin montarlos, un cambio de paleta
      # o de animaciones se queda en el host y nunca llega al contenedor.
      - ./apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts
      - ./apps/web/postcss.config.mjs:/app/apps/web/postcss.config.mjs
      - ./packages/types/src:/app/packages/types/src

volumes:
  kidcare_dev_pgdata:
