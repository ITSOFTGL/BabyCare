# Plantilla de una instancia de cliente.
#
# Para dar de alta una guarderia nueva:
#   cp -r deployments/_template deployments/<cliente>
#   cd deployments/<cliente> && cp .env.example .env   # y rellenarlo
#   docker compose up -d
#
# Cada cliente corre su propio backend y su propio frontend, y comparte solo el
# servidor Postgres (con base de datos propia) y el tunel de Cloudflare.
name: kidcare-${TENANT_SLUG}

services:
  backend:
    image: kidcare-backend:latest
    container_name: kidcare-${TENANT_SLUG}-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://kidcare:${POSTGRES_ADMIN_PASSWORD}@postgres-shared:5432/${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      TENANT_NAME: ${TENANT_NAME}
      PORT: '3001'
      CORS_ORIGINS: https://${SUBDOMAIN}.tudominio.com
      # Opcionales: sin ellas, Web Push simplemente queda desactivado (las
      # notificaciones in-app siguen funcionando). Genera un par propio con
      # `bunx web-push generate-vapid-keys`.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@tudominio.com}
      STORAGE_DIR: /app/storage
    volumes:
      # Facturas en PDF de este cliente. Nombrado con TENANT_SLUG para que no
      # choque con el volumen de otro cliente en el mismo host.
      - kidcare_${TENANT_SLUG}_storage:/app/storage
    networks: [kidcare_net]

  frontend:
    image: kidcare-frontend:latest
    container_name: kidcare-${TENANT_SLUG}-frontend
    restart: unless-stopped
    environment:
      # Se leen en runtime (no en build), por eso la misma imagen sirve para
      # cualquier cliente: ver apps/web/app/layout.tsx y apps/web/lib/api.ts.
      API_URL: https://${SUBDOMAIN}.tudominio.com/api
      TENANT_NAME: ${TENANT_NAME}
    depends_on: [backend]
    networks: [kidcare_net]

volumes:
  kidcare_${TENANT_SLUG}_storage:

networks:
  kidcare_net:
    external: true
